<!-- Supabase → Authentication → Emails → "Reset password"
     Subject: ตั้งรหัสผ่านใหม่ — สมุดรายรับรายจ่าย
     The link goes to the app's own confirm.html (not straight to Supabase), which asks for one click first. -->
<h2>ตั้งรหัสผ่านใหม่</h2>
<p>มีการขอตั้งรหัสผ่านใหม่สำหรับ <strong>สมุดรายรับรายจ่าย</strong> บัญชี {{ .Email }}</p>
<p>กดลิงก์ด้านล่าง แล้วกดปุ่ม "ตั้งรหัสผ่านใหม่" ในหน้าที่เปิดขึ้น</p>
<p><a href="{{ .SiteURL }}/confirm.html?token_hash={{ .TokenHash }}&type=recovery">ตั้งรหัสผ่านใหม่</a></p>
<p>ลิงก์ใช้ได้ครั้งเดียว ถ้าคุณไม่ได้ขอ ไม่ต้องทำอะไร — รหัสผ่านเดิมยังใช้ได้</p>
