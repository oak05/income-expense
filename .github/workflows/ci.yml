name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Tesseract OCR (Thai + English)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tha
          tesseract --list-langs

      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test (Python)
        run: pytest -v

      - name: Test (JavaScript)
        run: |
          node --version
          node --test tests/js/common.test.mjs

  image:
    name: Build, smoke-test and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SMOKE_TAG: income-expense-app:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image for the smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.SMOKE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:8000 "$SMOKE_TAG"
          for i in $(seq 1 40); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          echo
          curl -fs http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fs http://localhost:8080/api/ocr/status | tee /dev/stderr | grep -q '"available":true'
          curl -fs -o /dev/null http://localhost:8080/
          curl -fs -o /dev/null http://localhost:8080/receipts.html
          # real OCR inside the image, Thai and English receipts
          curl -fs -X POST -H "X-Requested-With: fetch" -H "X-Filename: restaurant.jpg" --data-binary @tests/fixtures/receipt-restaurant.jpg \
            http://localhost:8080/api/receipts | tee /dev/stderr | grep -q '"amount":364.87'
          curl -fs -X POST -H "X-Requested-With: fetch" -H "X-Filename: seven.jpg" --data-binary @tests/fixtures/receipt-7eleven-th.jpg \
            http://localhost:8080/api/receipts | tee /dev/stderr | grep -q '"amount":125.0'
          # another website can't change data; an unknown host name (DNS rebinding) is refused
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: text/plain' -H 'Origin: https://evil.example' --data-binary 'x' http://localhost:8080/api/restore)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: rebind.attacker.example' http://localhost:8080/api/health)" = "400"
          # runs as a normal user, data folder is writable, schema is current
          test "$(docker exec smoke id -u)" != "0"
          docker exec smoke python -m app.migrate status

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/income-expense-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
